<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Terminal with AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
      background-color: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    #terminal-output {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
    }

    #terminal-output::-webkit-scrollbar {
      width: 8px;
    }

    #terminal-output::-webkit-scrollbar-track {
      background: #2d2d2d;
    }

    #terminal-output::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }

    #terminal-output .input {
      color: #4ec9b0;
    }

    #terminal-output .output {
      color: #d4d4d4;
    }

    #terminal-output .error {
      color: #f48771;
    }

    #terminal-output .system {
      color: #888888;
      font-style: italic;
    }

    #input-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #prompt {
      color: #4ec9b0;
      font-weight: bold;
    }

    #terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #d4d4d4;
      font-family: inherit;
      font-size: inherit;
      outline: none;
    }

    #analysis-panel {
      width: 400px;
      background-color: #252526;
      border-left: 1px solid #3e3e42;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #analysis-header {
      padding: 16px;
      background-color: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      font-weight: bold;
      color: #cccccc;
    }

    #analysis-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      line-height: 1.6;
      color: #d4d4d4;
    }

    #analysis-content::-webkit-scrollbar {
      width: 8px;
    }

    #analysis-content::-webkit-scrollbar-track {
      background: #2d2d2d;
    }

    #analysis-content::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="main-container">
    <div id="terminal-container">
      <div id="terminal-output"></div>
      <div id="input-line">
        <span id="prompt">»</span>
        <input type="text" id="terminal-input" autofocus>
      </div>
    </div>
    <div id="analysis-panel">
      <div id="analysis-header">AI エラー解析</div>
      <div id="analysis-content"></div>
    </div>
  </div>
  <script src="dist/renderer.js"></script>
</body>
</html>
